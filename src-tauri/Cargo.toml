[package]
name = "shelf"
version = "0.1.6"
description = "A quieter way to read"
authors = ["Shelf contributors"]
license = "MIT"
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "shelf_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.0.0", features = [] }

[dependencies]
tauri = { version = "2.11.1", features = [] }
tauri-plugin-deep-link = "2.4.9"
tauri-plugin-fs = "2.5.1"
tauri-plugin-http = "2.5.9"
tauri-plugin-opener = "2.5.4"
serde_json = "1"
